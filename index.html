<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wozzby Foot | Connect With Us</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: #171515;

            background:
                radial-gradient(
                    circle at 5% 5%,
                    rgba(255, 0, 128, 0.16),
                    transparent 25%
                ),
                radial-gradient(
                    circle at 95% 95%,
                    rgba(255, 0, 128, 0.14),
                    transparent 27%
                ),
                linear-gradient(
                    135deg,
                    #ffffff 0%,
                    #fff9fc 50%,
                    #ffffff 100%
                );

            background-size: 200% 200%;
            animation: backgroundMove 12s ease infinite;

            display: flex;
            justify-content: center;

            padding: 45px 18px;

            overflow-x: hidden;
        }


        /* =========================
           BACKGROUND ANIMATION
        ========================= */

        @keyframes backgroundMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 520px;

            text-align: center;

            position: relative;
            z-index: 2;
        }


        /* =========================
           LOGO
        ========================= */

        .logo-box {

            width: 145px;
            height: 145px;

            background: #ffffff;

            border-radius: 32px;

            margin: 5px auto 24px;

            padding: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(255, 0, 128, 0.08);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.08),
                0 0 35px rgba(255, 0, 128, 0.13);

            animation:
                logoAppear 1s ease-out,
                logoFloat 4s ease-in-out infinite 1s;
        }


        .logo-box img {

            width: 100%;
            height: 100%;

            object-fit: contain;

            border-radius: 20px;

            display: block;
        }


        @keyframes logoAppear {

            0% {
                opacity: 0;
                transform: scale(0.6);
            }

            70% {
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }

        }


        @keyframes logoFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }

        }


        /* =========================
           HEADING
        ========================= */

        h1 {

            font-size: 42px;

            font-weight: 800;

            letter-spacing: -1.5px;

            color: #171515;

            margin-bottom: 7px;

            animation:
                titleAppear 0.9s ease-out 0.25s both;
        }


        .subtitle {

            font-size: 20px;

            color: #707070;

            margin-bottom: 42px;

            animation:
                titleAppear 0.9s ease-out 0.45s both;
        }


        @keyframes titleAppear {

            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           LINKS
        ========================= */

        .links {

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        .social-link {

            position: relative;

            width: 100%;

            min-height: 76px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 18px 65px 18px 65px;

            border-radius: 22px;

            text-decoration: none;

            font-size: 20px;

            font-weight: 700;

            letter-spacing: -0.2px;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;

            opacity: 0;

            animation:
                buttonAppear 0.75s ease forwards;
        }


        /* Button animation */

        .social-link:nth-child(1) {
            animation-delay: 0.65s;
        }

        .social-link:nth-child(2) {
            animation-delay: 0.82s;
        }

        .social-link:nth-child(3) {
            animation-delay: 0.99s;
        }

        .social-link:nth-child(4) {
            animation-delay: 1.16s;
        }


        @keyframes buttonAppear {

            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================
           ICON
        ========================= */

        .icon {

            position: absolute;

            left: 25px;

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 27px;

            transition:
                transform 0.3s ease;
        }


        .arrow {

            position: absolute;

            right: 24px;

            width: 28px;
            height: 28px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 22px;

            transition:
                transform 0.3s ease;
        }


        .social-link:hover {

            transform: translateY(-5px);

        }


        .social-link:hover .icon {

            transform: scale(1.12);
        }


        .social-link:hover .arrow {

            transform: translateX(5px);
        }


        /* =========================
           WEBSITE
        ========================= */

        .website {

            background:
                linear-gradient(
                    135deg,
                    #1d1a1b,
                    #282324
                );

            color: #ffffff;

            border: 2px solid #ff0080;

            box-shadow:
                0 10px 30px rgba(255, 0, 128, 0.18),
                0 8px 25px rgba(0, 0, 0, 0.12);

            overflow: hidden;
        }


        .website::before {

            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            right: -55px;
            bottom: -85px;

            border-radius: 50%;

            background:
                rgba(255, 0, 128, 0.14);

            transition:
                transform 0.5s ease;
        }


        .website:hover {

            box-shadow:
                0 15px 40px rgba(255, 0, 128, 0.28),
                0 12px 30px rgba(0, 0, 0, 0.15);
        }


        .website .icon,
        .website .arrow {

            color: #ffffff;
        }


        /* =========================
           WHATSAPP
        ========================= */

        .whatsapp {

            background: #ffffff;

            color: #171515;

            border: 2px solid rgba(255, 0, 128, 0.16);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.06);
        }


        .whatsapp:hover {

            border-color: #ff0080;

            box-shadow:
                0 12px 32px rgba(255, 0, 128, 0.16);
        }


        .whatsapp .icon {

            color: #25D366;
        }


        .whatsapp .arrow {

            color: #666666;
        }


        /* =========================
           INSTAGRAM
        ========================= */

        .instagram {

            background: rgba(255, 255, 255, 0.95);

            color: #171515;

            border: 2px solid rgba(255, 0, 128, 0.16);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.06);
        }


        .instagram:hover {

            border-color: #ff0080;

            box-shadow:
                0 12px 32px rgba(255, 0, 128, 0.16);
        }


        .instagram .icon {

            background:
                linear-gradient(
                    135deg,
                    #ff0080,
                    #ff4f9a,
                    #ff9f00
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            background-clip: text;
        }


        .instagram .arrow {

            color: #666666;
        }


        /* =========================
           FACEBOOK
        ========================= */

        .facebook {

            background: rgba(255, 255, 255, 0.95);

            color: #171515;

            border: 2px solid rgba(255, 0, 128, 0.16);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.06);
        }


        .facebook:hover {

            border-color: #ff0080;

            box-shadow:
                0 12px 32px rgba(255, 0, 128, 0.16);
        }


        .facebook .icon {

            color: #1877F2;
        }


        .facebook .arrow {

            color: #666666;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 42px;

            font-size: 15px;

            color: #8a8a8a;

            animation:
                titleAppear 1s ease-out 1.3s both;
        }


        .footer strong {

            color: #ff0080;

            font-weight: 700;
        }


        .footer-line {

            width: 55px;

            height: 5px;

            border-radius: 10px;

            background: #ff0080;

            margin: 13px auto 0;
        }


        /* =========================
           DECORATIVE CIRCLES
        ========================= */

        .container::before {

            content: "";

            position: fixed;

            width: 260px;
            height: 260px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 0, 128, 0.14),
                    rgba(255, 0, 128, 0)
                );

            top: -90px;
            left: -100px;

            z-index: -1;

            animation:
                circleFloat 8s ease-in-out infinite;
        }


        .container::after {

            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 0, 128, 0.13),
                    rgba(255, 0, 128, 0)
                );

            bottom: -120px;
            right: -120px;

            z-index: -1;

            animation:
                circleFloat 9s ease-in-out infinite reverse;
        }


        @keyframes circleFloat {

            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-25px);
            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }


            .logo-box {

                width: 125px;
                height: 125px;

                border-radius: 28px;

                margin-bottom: 22px;
            }


            h1 {

                font-size: 34px;

                letter-spacing: -1px;
            }


            .subtitle {

                font-size: 17px;

                margin-bottom: 32px;
            }


            .social-link {

                min-height: 68px;

                border-radius: 18px;

                font-size: 17px;

                padding-left: 60px;
                padding-right: 55px;
            }


            .icon {

                left: 20px;

                font-size: 24px;
            }


            .arrow {

                right: 18px;
            }


            .footer {

                margin-top: 32px;
            }

        }


        /* =========================
           ACCESSIBILITY
        ========================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                transition-duration: 0.01ms !important;
            }

        }

    </style>
</head>


<body>

    <div class="container">


        <!-- LOGO -->

        <div class="logo-box">

            <img
                src="./WhatsApp Image 2026-09-23 at 15.31.20.jpeg"
                alt="Wozzby Foot Logo">

        </div>


        <!-- HEADING -->

        <h1>Wozzby</h1>

        <p class="subtitle">

        </p>


        <!-- LINKS -->

        <div class="links">


            <!-- WEBSITE -->

            <a

                <span class="icon">

                </span>

                <span>
                    WhatsApp
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


            <!-- INSTAGRAM -->

            <a
                class="social-link instagram"
                href="https://www.instagram.com/wozzby_official/"
                target="_blank"
                rel="noopener noreferrer">

                <span class="icon">
                    <i class="fa-brands fa-instagram"></i>
                </span>

                <span>
                    Instagram
                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>


            <!-- FACEBOOK -->

            <a
                class="social-link facebook"
                href="https://www.facebook.com/profile.php?id=61583215988917"

                <span class="icon">

                <span>

                </span>

                <span class="arrow">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>

            </a>

        </div>


        <!-- FOOTER -->

        <div class="footer">

            © 2026 <strong>Wozzby</strong>

            <div class="footer-line"></div>

        </div>


    </div>

</body>
</html>
